<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администратор · Консультации</title><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><style>body{margin:0;background:#f5f7fb;font-family:system-ui;color:#172033}.box{max-width:560px;margin:70px auto;padding:28px;background:#fff;border:1px solid #e5e9f2;border-radius:20px;box-shadow:0 18px 45px #26365412}h1{margin:0 0 8px;font-size:24px}p{color:#6f7b91}.btn{border:0;border-radius:11px;padding:13px 18px;background:#356ae6;color:white;font-weight:700;cursor:pointer}.note{margin-top:18px;font-size:13px;color:#6f7b91}</style></head><body><main class="box"><h1>Администратор</h1><p>Здесь можно скачать заявки, сохранённые в этом браузере.</p><button class="btn" onclick="downloadExcel()">↓ Скачать Excel (.xlsx)</button><p class="note">Серверную выгрузку подключим после настройки защищённого API.</p></main><script>function downloadExcel(){let rows=JSON.parse(localStorage.getItem('consultations')||'[]');if(!rows.length){alert('Сохранённых заявок пока нет');return}let data=rows.map((r,i)=>({'№':i+1,'Учитель':r.teacher,'Класс':r.className,'Ученики':r.students.join('\n'),'Предмет':r.subject,'Дата':r.date,'Время':r.time,'Продолжительность':(r.duration||'1')+' ч','Кабинет':r.room||''}));let ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:6},{wch:28},{wch:10},{wch:30},{wch:20},{wch:12},{wch:10},{wch:18},{wch:12}];ws['!rows']=data.map((r,i)=>({hpt:i===0?30:Math.max(24,15*(String(r['Ученики']).split('\n').length))}));let header=['A1','B1','C1','D1','E1','F1','G1','H1','I1'];header.forEach(a=>{if(ws[a])ws[a].s={font:{bold:true,color:'FFFFFF'},fill:{fgColor:{rgb:'356AE6'}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:{top:{style:'thin',color:{rgb:'9AA7BF'}},bottom:{style:'thin',color:{rgb:'9AA7BF'}},left:{style:'thin',color:{rgb:'9AA7BF'}},right:{style:'thin',color:{rgb:'9AA7BF'}}}}});for(let r=2;r<=data.length+1;r++){for(let c=1;c<=9;c++){let a=XLSX.utils.encode_cell({r:r-1,c:c-1});if(ws[a])ws[a].s={alignment:{vertical:'top',wrapText:true},border:{bottom:{style:'thin',color:{rgb:'D8DEEA'}}}}}}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Консультации');XLSX.writeFile(wb,'konsultacii.xlsx')}</script></body></html>
