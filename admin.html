<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администратор · Консультации</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{margin:0;background:#f5f7fb;font-family:system-ui;color:#172033}.box{max-width:560px;margin:70px auto;padding:28px;background:#fff;border:1px solid #e5e9f2;border-radius:20px;box-shadow:0 18px 45px #26365412}h1{margin:0 0 8px;font-size:24px}p{color:#6f7b91}.btn{border:0;border-radius:11px;padding:13px 18px;background:#356ae6;color:white;font-weight:700;cursor:pointer}.note{margin-top:18px;font-size:13px;color:#6f7b91}</style></head><body><main class="box"><h1>Администратор</h1><p>Здесь можно скачать заявки, сохранённые в этом браузере.</p><button class="btn" onclick="downloadExcel()">↓ Скачать Excel (.xlsx)</button><p class="note">Серверную выгрузку подключим после настройки защищённого API.</p></main><script>function downloadExcel(){let rows=JSON.parse(localStorage.getItem('consultations')||'[]');if(!rows.length){alert('Сохранённых заявок пока нет');return}let data=rows.map(r=>({'Учитель':r.teacher,'Класс':r.className,'Ученики':r.students.join('\n'),'Предмет':r.subject,'Дата':r.date,'Время':r.time,'Продолжительность':(r.duration||'1')+' ч','Кабинет':r.room||''}));let ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:28},{wch:10},{wch:28},{wch:20},{wch:12},{wch:10},{wch:18},{wch:12}];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Консультации');XLSX.writeFile(wb,'konsultacii.xlsx')}</script></body></html>
